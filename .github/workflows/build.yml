name: Build and publish
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: windows-latest
            rid: win-x64
          - os: macos-14
            rid: osx-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Check build and debug tooling
        run: python -m unittest discover -s tests/tooling -v
      - name: Test managed components
        run: dotnet test tests/Runninghill.Tests/Runninghill.Tests.csproj -m:1
      - name: Publish self-contained ReadyToRun service
        run: dotnet publish src/Runninghill.Service -c Release -r ${{ matrix.rid }} -o artifacts/service
      - name: Publish native CLI
        run: dotnet publish src/Clients/Runninghill.Cli -c Release -r ${{ matrix.rid }} -o artifacts/cli
      - name: Check native CLI failure messages
        run: python tests/cli/smoke.py --cli-directory artifacts/cli
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.rid }}
          path: artifacts/
  containers:
    needs: native
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/dev-setup.py
      - run: docker compose build
      - run: docker compose up -d --wait --wait-timeout 120 database
      - run: docker compose run --rm --no-deps service --migrate-database
      - run: docker compose up -d --wait --wait-timeout 120
      - run: python3 scripts/smoke-stack.py
      - uses: actions/download-artifact@v4
        with:
          name: native-linux-x64
          path: artifacts/native
      - run: chmod +x artifacts/native/cli/Runninghill.Cli
      - run: python3 tests/cli/collection.py --cli-directory artifacts/native/cli
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/browser/package-lock.json
      - run: npm ci --prefix tests/browser
      - run: npx --prefix tests/browser playwright-core install --with-deps chromium
      - run: python3 tests/integration/collection.py
      - run: node tests/browser/smoke.cjs
      - run: node tests/browser/collection.cjs
      - run: node tests/browser/collection-regressions.cjs
      - run: node tests/browser/logs.cjs
      - name: Check database outage isolation
        run: |
          docker compose stop database
          python3 scripts/smoke-stack.py --expect-unavailable
          docker compose start database
      - name: Logs
        if: failure()
        run: docker compose logs --tail 100
      - name: Clean up ephemeral CI stack
        if: always()
        run: docker compose down --volumes

  windows-ui:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet workload install maui-windows
      - name: Compile native WinUI collection screen with debugger symbols
        run: python scripts/build.py build --target maui -c Debug --framework net10.0-windows10.0.19041.0 --rid win-x64
      - name: Publish self-contained WinUI desktop app
        run: python scripts/build.py publish --target maui --framework net10.0-windows10.0.19041.0 --rid win-x64
      - name: Verify Windows publish output
        shell: pwsh
        run: |
          $publish = 'artifacts/Release/maui/win-x64'
          if (!(Test-Path "$publish/Runninghill.Maui.exe")) { throw 'Desktop executable is missing.' }
          if (!(Test-Path "$publish/Microsoft.UI.Xaml.dll")) { throw 'Bundled WinUI runtime is missing.' }
          if (!(Test-Path "$publish/coreclr.dll")) { throw 'Bundled .NET runtime is missing.' }
      - uses: actions/upload-artifact@v4
        with:
          name: runninghill-desktop-win-x64
          path: artifacts/Release/maui/win-x64/
          if-no-files-found: error

  database-providers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Publish ReadyToRun service with default Release settings
        run: dotnet publish src/Runninghill.Service -c Release -r linux-x64 -o artifacts/service
      - name: Test all four EF providers and the published service against real databases
        run: python3 tests/integration/providers.py --service "$PWD/artifacts/service/Runninghill.Service"
