server {
    listen 127.0.0.1:5082;
    server_tokens off;
    root /usr/share/nginx/html;
    include /etc/nginx/mime.types;
    types { application/wasm wasm; }
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    # Keep API calls on the same browser origin; tokens are forwarded, never stored here.
    location /api/ {
        proxy_pass http://127.0.0.1:5080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
    }
    location /health/live { access_log off; return 200 'Healthy'; }
    location /_framework/ {
        # Publishing already compressed these files. Send the .gz copy when supported:
        # fewer bytes over the network, with no compression work on each request.
        gzip_static on;
        gzip_vary on;
        try_files $uri =404;
    }
    # Page routes belong to Blazor. Unknown framework files above must still return 404.
    location / { try_files $uri $uri/ /index.html; }
}
