# TLS ends at nginx. The API stays on the private Docker network or loopback.
ssl_certificate /etc/nginx/tls/localhost.crt;
ssl_certificate_key /etc/nginx/tls/localhost.key;
ssl_protocols TLSv1.2 TLSv1.3;
ssl_session_cache shared:RunninghillTLS:10m;
ssl_session_timeout 10m;
ssl_session_tickets off;
server_tokens off;
root /usr/share/nginx/html;
include /etc/nginx/mime.types;
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy no-referrer always;
# No HSTS on shared localhost: other local development apps may still use HTTP.
# Log the route without query strings, which can contain diagnostic searches.
access_log /dev/stdout runninghill_tls;

location /api/ {
    proxy_pass http://runninghill_http;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $http_host;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Replace supplied forwarding headers instead of trusting a caller's claimed IP.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_connect_timeout 3s;
    proxy_read_timeout 15s;
    proxy_send_timeout 15s;
    client_max_body_size 16k;
}
# Native gRPC uses HTTP/2 through the same TLS listener. This is not gRPC-Web.
location /runninghill.v1.Application/ {
    grpc_pass grpc://runninghill_grpc;
    grpc_set_header Host $http_host;
    grpc_set_header Authorization $http_authorization;
    grpc_set_header X-Forwarded-Proto $scheme;
    grpc_set_header X-Forwarded-For $remote_addr;
    grpc_connect_timeout 3s;
    grpc_read_timeout 15s;
    grpc_send_timeout 15s;
}
location = /health/ready {
    access_log off;
    proxy_pass http://runninghill_http;
    proxy_connect_timeout 3s;
    proxy_read_timeout 10s;
}
location = /health/live { access_log off; return 200 'Healthy'; }
location /_framework/ {
    gzip_static on;
    gzip_vary on;
    try_files $uri =404;
}
# Revalidate the entry page and app scripts after a deployment. Framework assets keep their existing caching.
location / {
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    try_files $uri $uri/ /index.html;
}
