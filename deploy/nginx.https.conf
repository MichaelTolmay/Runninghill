log_format runninghill_tls '$remote_addr $request_method $uri $status $body_bytes_sent';
# Only the small listener/upstream wrapper changes between bridge and host networking.
upstream runninghill_http { server service:5080; keepalive 16; }
upstream runninghill_grpc { server service:5081; }
server {
    listen 8080;
    server_tokens off;
    access_log /dev/stdout runninghill_tls;
    # Container health checks remain local HTTP calls without credentials.
    location = /health/live { access_log off; return 200 'Healthy'; }
    # Use a fixed destination so a forged Host header cannot change the redirect target.
    location / { return 308 https://localhost:5443$request_uri; }
}
server {
    listen 8443 ssl;
    http2 on;
    server_name localhost;
    include /etc/nginx/runninghill/https-common.conf;
}
