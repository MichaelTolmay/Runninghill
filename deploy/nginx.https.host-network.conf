log_format runninghill_tls '$remote_addr $request_method $uri $status $body_bytes_sent';
upstream runninghill_http { server 127.0.0.1:5080; keepalive 16; }
upstream runninghill_grpc { server 127.0.0.1:5081; }
server {
    listen 127.0.0.1:5082;
    server_tokens off;
    access_log /dev/stdout runninghill_tls;
    location = /health/live { access_log off; return 200 'Healthy'; }
    location / { return 308 https://localhost:5443$request_uri; }
}
server {
    listen 127.0.0.1:5443 ssl;
    http2 on;
    server_name localhost;
    include /etc/nginx/runninghill/https-common.conf;
}
