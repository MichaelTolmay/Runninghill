syntax = "proto3";

option csharp_namespace = "Runninghill.Service.Grpc";
package runninghill.v1;

import "google/protobuf/empty.proto";
import "google/protobuf/wrappers.proto";

// Transport contracts stay here; the shared domain models assembly remains empty.
service Application {
  rpc GetStatus (google.protobuf.Empty) returns (google.protobuf.StringValue);
}
