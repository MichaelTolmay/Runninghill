syntax = "proto3";

option csharp_namespace = "Runninghill.Service.Grpc";
package runninghill.v1;

import "google/protobuf/empty.proto";
import "google/protobuf/wrappers.proto";

// This file is the gRPC wire contract. Changing it can affect clients written in any language.
// Empty means there are no input fields; StringValue carries the status text.
service Application {
  rpc GetStatus (google.protobuf.Empty) returns (google.protobuf.StringValue);
}
